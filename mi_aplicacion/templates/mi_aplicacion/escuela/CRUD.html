{% extends 'mi_aplicacion/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html>
<title>{{ TITULO }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<body>
{% block encabezado %}
{% endblock %}
{% block contenido %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm mt-3 {{ BG_COLOR }}">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">{{ SUBTITULO }}</h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form|crispy }}
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn {{ COLOR_BOTON }}">{{ TEXTO_BOTON }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
